name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests & Validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Create CI Environment File for Docker Compose Validation
        run: |
          # Provide a minimal .env so docker compose config can resolve all variables
          cp .env.example .env
          sed -i 's/^APP_API_KEY=.*/APP_API_KEY=ci-test-secret-key-123/' .env
          sed -i 's/^GROQ_API_KEY=.*/GROQ_API_KEY=ci-test-groq-key-456/' .env

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Execute Pytest Suite (Unit & Evaluation Tests)
        env:
          APP_API_KEY: "ci-test-secret-key-123"
          GROQ_API_KEY: "ci-test-groq-key-456"
          LLM_PROVIDER: "ollama"
          CHROMA_HOST: "localhost"
          CHROMA_PORT: "8000"
        run: |
          pytest tests/ -v
