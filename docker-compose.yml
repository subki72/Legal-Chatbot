version: '3.9'

services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: legal-chromadb
    ports:
      - "8001:8000"
    volumes:
      - ./Data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal-backend
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - ./Data:/app/Data
    depends_on:
      - chromadb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    dns:
      - 8.8.8.8
    environment:
      - BACKEND_URL=http://backend:8000
